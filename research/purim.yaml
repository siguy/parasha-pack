verses:
- ref: Esther 2:7
  he_ref: אסתר ב׳:ז׳
  en:
  - He was foster father to Hadassah—that is, Esther—his uncle’s daughter, for she had neither father
    nor mother. The maiden was shapely and beautiful; and when her father and mother died, Mordecai adopted
    her as his own daughter.
  he:
  - וַיְהִי אֹמֵן אֶת־הֲדַסָּה הִיא אֶסְתֵּר בַּת־דֹּדוֹ כִּי אֵין לָהּ אָב וָאֵם וְהַנַּעֲרָה יְפַת־תֹּאַר
    וְטוֹבַת מַרְאֶה וּבְמוֹת אָבִיהָ וְאִמָּהּ לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת׃
- ref: Esther 2:10
  he_ref: אסתר ב׳:י׳
  en:
  - Esther did not reveal her people or her kindred, for Mordecai had told her not to reveal it.
  he:
  - לֹא־הִגִּידָה אֶסְתֵּר אֶת־עַמָּהּ וְאֶת־מוֹלַדְתָּהּ כִּי מָרְדֳּכַי צִוָּה עָלֶיהָ אֲשֶׁר לֹא־תַגִּיד׃
- ref: Esther 2:17
  he_ref: אסתר ב׳:י״ז
  en:
  - The king loved Esther more than all the other women, and she won his grace and favor more than all
    the virgins. So he set a royal diadem on her head and made her queen instead of Vashti.
  he:
  - וַיֶּאֱהַב הַמֶּלֶךְ אֶת־אֶסְתֵּר מִכָּל־הַנָּשִׁים וַתִּשָּׂא־חֵן וָחֶסֶד לְפָנָיו מִכָּל־הַבְּתוּלֹת
    וַיָּשֶׂם כֶּתֶר־מַלְכוּת בְּרֹאשָׁהּ וַיַּמְלִיכֶהָ תַּחַת וַשְׁתִּי׃
- ref: Esther 3:2-6
  he_ref: אסתר ג׳:ב׳-ו׳
  en:
  - All the king’s courtiers in the palace gate knelt and bowed low to Haman, for such was the king’s
    order concerning him; but Mordecai would not kneel or bow low.
  - Then the king’s courtiers who were in the palace gate said to Mordecai, “Why do you disobey the king’s
    order?”
  - When they spoke to him day after day and he would not listen to them, they told Haman, in order to
    see whether Mordecai’s resolve would prevail; for he had explained to them that he was a Jew.
  - When Haman saw that Mordecai would not kneel or bow low to him, Haman was filled with rage.
  - But he disdained to lay hands on Mordecai alone; having been told who Mordecai’s people were, Haman
    plotted to do away with all the Jews, Mordecai’s people, throughout the kingdom of Ahasuerus.
  he:
  - וְכָל־עַבְדֵי הַמֶּלֶךְ אֲשֶׁר־בְּשַׁעַר הַמֶּלֶךְ כֹּרְעִים וּמִשְׁתַּחֲוִים לְהָמָן כִּי־כֵן צִוָּה־לוֹ
    הַמֶּלֶךְ וּמָרְדֳּכַי לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה׃
  - וַיֹּאמְרוּ עַבְדֵי הַמֶּלֶךְ אֲשֶׁר־בְּשַׁעַר הַמֶּלֶךְ לְמָרְדֳּכָי מַדּוּעַ אַתָּה עוֹבֵר אֵת מִצְוַת
    הַמֶּלֶךְ׃
  - וַיְהִי באמרם [כְּאָמְרָם] אֵלָיו יוֹם וָיוֹם וְלֹא שָׁמַע אֲלֵיהֶם וַיַּגִּידוּ לְהָמָן לִרְאוֹת
    הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי כִּי־הִגִּיד לָהֶם אֲשֶׁר־הוּא יְהוּדִי׃
  - וַיַּרְא הָמָן כִּי־אֵין מָרְדֳּכַי כֹּרֵעַ וּמִשְׁתַּחֲוֶה לוֹ וַיִּמָּלֵא הָמָן חֵמָה׃
  - וַיִּבֶז בְּעֵינָיו לִשְׁלֹח יָד בְּמָרְדֳּכַי לְבַדּוֹ כִּי־הִגִּידוּ לוֹ אֶת־עַם מָרְדֳּכָי וַיְבַקֵּשׁ
    הָמָן לְהַשְׁמִיד אֶת־כָּל־הַיְּהוּדִים אֲשֶׁר בְּכָל־מַלְכוּת אֲחַשְׁוֵרוֹשׁ עַם מָרְדֳּכָי׃
- ref: Esther 4:11-16
  he_ref: אסתר ד׳:י״א-ט״ז
  en:
  - “All the king’s courtiers and the people of the king’s provinces know that if any person, man or woman,
    enters the king’s presence in the inner court without having been summoned, there is but one law for
    him—that he be put to death. Only if the king extends the golden scepter to him may he live. Now I
    have not been summoned to visit the king for the last thirty days.”
  - When Mordecai was told what Esther had said,
  - 'Mordecai had this message delivered to Esther: “Do not imagine that you, of all the Jews, will escape
    with your life by being in the king’s palace.'
  - On the contrary, if you keep silent in this crisis, relief and deliverance will come to the Jews from
    another quarter, while you and your father’s house will perish. And who knows, perhaps you have attained
    to royal position for just such a crisis.”
  - 'Then Esther sent back this answer to Mordecai:'
  - “Go, assemble all the Jews who live in Shushan, and fast in my behalf; do not eat or drink for three
    days, night or day. I and my maids will observe the same fast. Then I shall go to the king, though
    it is contrary to the law; and if I am to perish, I shall perish!”
  he:
  - כָּל־עַבְדֵי הַמֶּלֶךְ וְעַם־מְדִינוֹת הַמֶּלֶךְ יוֹדְעִים אֲשֶׁר כָּל־אִישׁ וְאִשָּׁה אֲשֶׁר יָבוֹא־אֶל־הַמֶּלֶךְ
    אֶל־הֶחָצֵר הַפְּנִימִית אֲשֶׁר לֹא־יִקָּרֵא אַחַת דָּתוֹ לְהָמִית לְבַד מֵאֲשֶׁר יוֹשִׁיט־לוֹ הַמֶּלֶךְ
    אֶת־שַׁרְבִיט הַזָּהָב וְחָיָה וַאֲנִי לֹא נִקְרֵאתי לָבוֹא אֶל־הַמֶּלֶךְ זֶה שְׁלוֹשִׁים יוֹם׃
  - וַיַּגִּידוּ לְמָרְדֳּכָי אֵת דִּבְרֵי אֶסְתֵּר׃
  - וַיֹּאמֶר מָרְדֳּכַי לְהָשִׁיב אֶל־אֶסְתֵּר אַל־תְּדַמִּי בְנַפְשֵׁךְ לְהִמָּלֵט בֵּית־הַמֶּלֶךְ מִכָּל־הַיְּהוּדִים׃
  - כִּי אִם־הַחֲרֵשׁ תַּחֲרִישִׁי בָּעֵת הַזֹּאת רֶוַח וְהַצָּלָה יַעֲמוֹד לַיְּהוּדִים מִמָּקוֹם אַחֵר
    וְאַתְּ וּבֵית־אָבִיךְ תֹּאבֵדוּ וּמִי יוֹדֵעַ אִם־לְעֵת כָּזֹאת הִגַּעַתְּ לַמַּלְכוּת׃
  - וַתֹּאמֶר אֶסְתֵּר לְהָשִׁיב אֶל־מָרְדֳּכָי׃
  - לֵךְ כְּנוֹס אֶת־כָּל־הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן וְצוּמוּ עָלַי וְאַל־תֹּאכְלוּ וְאַל־תִּשְׁתּוּ
    שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם גַּם־אֲנִי וְנַעֲרֹתַי אָצוּם כֵּן וּבְכֵן אָבוֹא אֶל־הַמֶּלֶךְ אֲשֶׁר
    לֹא־כַדָּת וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי׃
- ref: Esther 5:1-2
  he_ref: אסתר ה׳:א׳-ב׳
  en:
  - On the third day, Esther put on royal apparel and stood in the inner court of the king’s palace, facing
    the king’s palace, while the king was sitting on his royal throne in the throne room facing the entrance
    of the palace.
  - As soon as the king saw Queen Esther standing in the court, she won his favor. The king extended to
    Esther the golden scepter that he had in his hand, and Esther approached and touched the tip of the
    scepter.
  he:
  - וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת וַתַּעֲמֹד בַּחֲצַר בֵּית־הַמֶּלֶךְ
    הַפְּנִימִית נֹכַח בֵּית הַמֶּלֶךְ וְהַמֶּלֶךְ יוֹשֵׁב עַל־כִּסֵּא מַלְכוּתוֹ בְּבֵית הַמַּלְכוּת
    נֹכַח פֶּתַח הַבָּיִת׃
  - וַיְהִי כִרְאוֹת הַמֶּלֶךְ אֶת־אֶסְתֵּר הַמַּלְכָּה עֹמֶדֶת בֶּחָצֵר נָשְׂאָה חֵן בְּעֵינָיו וַיּוֹשֶׁט
    הַמֶּלֶךְ לְאֶסְתֵּר אֶת־שַׁרְבִיט הַזָּהָב אֲשֶׁר בְּיָדוֹ וַתִּקְרַב אֶסְתֵּר וַתִּגַּע בְּרֹאשׁ
    הַשַּׁרְבִיט׃
- ref: Esther 7:3-6
  he_ref: אסתר ז׳:ג׳-ו׳
  en:
  - 'Queen Esther replied: “If Your Majesty will do me the favor, and if it pleases Your Majesty, let
    my life be granted me as my wish, and my people as my request.'
  - For we have been sold, my people and I, to be destroyed, massacred, and exterminated. Had we only
    been sold as bondmen and bondwomen, I would have kept silent; for the adversary is not worthy of the
    king’s trouble.”
  - Thereupon King Ahasuerus demanded of Queen Esther, “Who is he and where is he who dared to do this?”
  - “The adversary and enemy,” replied Esther, “is this evil Haman!” And Haman cringed in terror before
    the king and the queen.
  he:
  - וַתַּעַן אֶסְתֵּר הַמַּלְכָּה וַתֹּאמַר אִם־מָצָאתִי חֵן בְּעֵינֶיךָ הַמֶּלֶךְ וְאִם־עַל־הַמֶּלֶךְ
    טוֹב תִּנָּתֶן־לִי נַפְשִׁי בִּשְׁאֵלָתִי וְעַמִּי בְּבַקָּשָׁתִי׃
  - כִּי נִמְכַּרְנוּ אֲנִי וְעַמִּי לְהַשְׁמִיד לַהֲרוֹג וּלְאַבֵּד וְאִלּוּ לַעֲבָדִים וְלִשְׁפָחוֹת
    נִמְכַּרְנוּ הֶחֱרַשְׁתִּי כִּי אֵין הַצָּר שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ׃
  - וַיֹּאמֶר הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ וַיֹּאמֶר לְאֶסְתֵּר הַמַּלְכָּה מִי הוּא זֶה וְאֵי־זֶה הוּא אֲשֶׁר־מְלָאוֹ
    לִבּוֹ לַעֲשׂוֹת כֵּן׃
  - וַתֹּאמֶר־אֶסְתֵּר אִישׁ צַר וְאוֹיֵב הָמָן הָרָע הַזֶּה וְהָמָן נִבְעַת מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה׃
- ref: Esther 8:3-8
  he_ref: אסתר ח׳:ג׳-ח׳
  en:
  - Esther spoke to the king again, falling at his feet and weeping, and pleading with him to avert the
    evil plotted by Haman the Agagite against the Jews.
  - The king extended the golden scepter to Esther, and Esther arose and stood before the king.
  - “If it please Your Majesty,” she said, “and if I have won your favor and the proposal seems right
    to Your Majesty, and if I am pleasing to you—let dispatches be written countermanding those that were
    written by Haman son of Hammedatha the Agagite, embodying his plot to annihilate the Jews throughout
    the king’s provinces.
  - For how can I bear to see the disaster that will befall my people! And how can I bear to see the destruction
    of my kindred!”
  - Then King Ahasuerus said to Queen Esther and Mordecai the Jew, “I have given Haman’s property to Esther,
    and he has been impaled on the stake for scheming against the Jews.
  - And you may further write with regard to the Jews as you see fit. [Write it] in the king’s name and
    seal it with the king’s signet, for an edict that has been written in the king’s name and sealed with
    the king’s signet may not be revoked.”
  he:
  - וַתּוֹסֶף אֶסְתֵּר וַתְּדַבֵּר לִפְנֵי הַמֶּלֶךְ וַתִּפֹּל לִפְנֵי רַגְלָיו וַתֵּבְךְּ וַתִּתְחַנֶּן־לוֹ
    לְהַעֲבִיר אֶת־רָעַת הָמָן הָאֲגָגִי וְאֵת מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב עַל־הַיְּהוּדִים׃
  - וַיּוֹשֶׁט הַמֶּלֶךְ לְאֶסְתֵּר אֵת שַׁרְבִט הַזָּהָב וַתָּקָם אֶסְתֵּר וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ׃
  - וַתֹּאמֶר אִם־עַל־הַמֶּלֶךְ טוֹב וְאִם־מָצָאתִי חֵן לְפָנָיו וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ וְטוֹבָה
    אֲנִי בְּעֵינָיו יִכָּתֵב לְהָשִׁיב אֶת־הַסְּפָרִים מַחֲשֶׁבֶת הָמָן בֶּן־הַמְּדָתָא הָאֲגָגִי אֲשֶׁר
    כָּתַב לְאַבֵּד אֶת־הַיְּהוּדִים אֲשֶׁר בְּכָל־מְדִינוֹת הַמֶּלֶךְ׃
  - כִּי אֵיכָכָה אוּכַל וְרָאִיתִי בָּרָעָה אֲשֶׁר־יִמְצָא אֶת־עַמִּי וְאֵיכָכָה אוּכַל וְרָאִיתִי בְּאָבְדַן
    מוֹלַדְתִּי׃
  - וַיֹּאמֶר הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ לְאֶסְתֵּר הַמַּלְכָּה וּלְמָרְדֳּכַי הַיְּהוּדִי הִנֵּה בֵית־הָמָן
    נָתַתִּי לְאֶסְתֵּר וְאֹתוֹ תָּלוּ עַל־הָעֵץ עַל אֲשֶׁר־שָׁלַח יָדוֹ ביהודיים [בַּיְּהוּדִים׃]
  - וְאַתֶּם כִּתְבוּ עַל־הַיְּהוּדִים כַּטּוֹב בְּעֵינֵיכֶם בְּשֵׁם הַמֶּלֶךְ וְחִתְמוּ בְּטַבַּעַת הַמֶּלֶךְ
    כִּי־כְתָב אֲשֶׁר־נִכְתָּב בְּשֵׁם־הַמֶּלֶךְ וְנַחְתּוֹם בְּטַבַּעַת הַמֶּלֶךְ אֵין לְהָשִׁיב׃
- ref: Esther 8:11
  he_ref: אסתר ח׳:י״א
  en:
  - 'to this effect: The king has permitted the Jews of every city to assemble and fight for their lives;
    if any people or province attacks them, they may destroy, massacre, and exterminate its armed force
    together with women and children, and plunder their possessions—'
  he:
  - אֲשֶׁר נָתַן הַמֶּלֶךְ לַיְּהוּדִים אֲשֶׁר בְּכָל־עִיר־וָעִיר לְהִקָּהֵל וְלַעֲמֹד עַל־נַפְשָׁם לְהַשְׁמִיד
    וְלַהֲרֹג וּלְאַבֵּד אֶת־כָּל־חֵיל עַם וּמְדִינָה הַצָּרִים אֹתָם טַף וְנָשִׁים וּשְׁלָלָם לָבוֹז׃
- ref: Esther 8:16
  he_ref: אסתר ח׳:ט״ז
  en:
  - The Jews enjoyed light and gladness, happiness and honor.
  he:
  - לַיְּהוּדִים הָיְתָה אוֹרָה וְשִׂמְחָה וְשָׂשֹׂן וִיקָר׃
- ref: Esther 9:1-2
  he_ref: אסתר ט׳:א׳-ב׳
  en:
  - And so, on the thirteenth day of the twelfth month—that is, the month of Adar—when the king’s command
    and decree were to be executed, the very day on which the enemies of the Jews had expected to get
    them in their power, the opposite happened, and the Jews got their enemies in their power.
  - Throughout the provinces of King Ahasuerus, the Jews mustered in their cities to attack those who
    sought their hurt; and no one could withstand them, for the fear of them had fallen upon all the peoples.
  he:
  - וּבִשְׁנֵים עָשָׂר חֹדֶשׁ הוּא־חֹדֶשׁ אֲדָר בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ אֲשֶׁר הִגִּיעַ דְּבַר־הַמֶּלֶךְ
    וְדָתוֹ לְהֵעָשׂוֹת בַּיּוֹם אֲשֶׁר שִׂבְּרוּ אֹיְבֵי הַיְּהוּדִים לִשְׁלוֹט בָּהֶם וְנַהֲפוֹךְ הוּא
    אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה בְּשֹׂנְאֵיהֶם׃
  - נִקְהֲלוּ הַיְּהוּדִים בְּעָרֵיהֶם בְּכָל־מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ לִשְׁלֹחַ יָד בִּמְבַקְשֵׁי
    רָעָתָם וְאִישׁ לֹא־עָמַד לִפְנֵיהֶם כִּי־נָפַל פַּחְדָּם עַל־כָּל־הָעַמִּים׃
- ref: Esther 9:20-22
  he_ref: אסתר ט׳:כ׳-כ״ב
  en:
  - Mordecai recorded these events. And he sent dispatches to all the Jews throughout the provinces of
    King Ahasuerus, near and far,
  - charging them to observe the fourteenth and fifteenth days of Adar, every year—
  - the same days on which the Jews enjoyed relief from their foes and the same month that had been transformed
    for them from one of grief and mourning to one of festive joy. They were to observe them as days of
    feasting and merrymaking, and as an occasion for sending gifts to one another and presents to the
    poor.
  he:
  - וַיִּכְתֹּב מָרְדֳּכַי אֶת־הַדְּבָרִים הָאֵלֶּה וַיִּשְׁלַח סְפָרִים אֶל־כָּל־הַיְּהוּדִים אֲשֶׁר
    בְּכָל־מְדִינוֹת הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ הַקְּרוֹבִים וְהָרְחוֹקִים׃
  - לְקַיֵּם עֲלֵיהֶם לִהְיוֹת עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר וְאֵת יוֹם־חֲמִשָּׁה
    עָשָׂר בּוֹ בְּכָל־שָׁנָה וְשָׁנָה׃
  - כַּיָּמִים אֲשֶׁר־נָחוּ בָהֶם הַיְּהוּדִים מֵאוֹיְבֵיהֶם וְהַחֹדֶשׁ אֲשֶׁר נֶהְפַּךְ לָהֶם מִיָּגוֹן
    לְשִׂמְחָה וּמֵאֵבֶל לְיוֹם טוֹב לַעֲשׂוֹת אוֹתָם יְמֵי מִשְׁתֶּה וְשִׂמְחָה וּמִשְׁלוֹחַ מָנוֹת אִישׁ
    לְרֵעֵהוּ וּמַתָּנוֹת לָאֶבְיוֹנִים׃
commentaries:
- ref: Rashi on Esther 3:2:1
  note: 'Why Mordechai would not bow: Haman made himself into an idol (midrash).'
  en: Kneeled and prostrated themselves. Because he made himself as a god; therefore, “but Mordechai would
    neither kneel nor prostrate himself.”
  en_version:
    title: The Metsudah Five Megillot, Lakewood, N.J., 2001
    license: CC-BY
  he: 'כֹּרְעִים וּמִשְׁתַּחֲוִים. שֶׁעָשָׂה עַצְמוֹ אֱלוֹהַּ, לְפִיכָךְ, וּמָרְדְּכַי לֹא יִכְרַע וְלֹא
    יִשְׁתַּחֲוֶה:'
  he_version:
    title: The Metsudah Five Megillot, Lakewood, N.J., 2001
    license: CC-BY
- ref: Chullin 139b
  note: '''Where is Esther hinted at in the Torah? I will surely hide (haster astir) My face'' (Deut.
    31:18): Hashem is hidden in the Megillah. Ref only.'
- ref: Megillah 7a
  note: Mishloach manot = two portions of food to one person; matanot la'evyonim = gifts to two poor people
    (Shulchan Aruch OC 694-695). Ref only.
- ref: Shulchan Arukh, Orach Chayim 690:17
  note: 'Rema: the custom of children making noise to ''blot out'' Haman''s name. Ref only.'
