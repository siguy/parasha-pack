verses:
- ref: Genesis 1:1-5
  he_ref: בראשית א׳:א׳-ה׳
  en:
  - In the beginning Elohim created the heavens and the earth.
  - The earth was unformed and desolate, and (there was) darkness over the surface of the abyss. The breath
    of Elohim hovered above the surface of the water.
  - Elohim said, Let there be light. and there was light.
  - Elohim saw that the light was good, and Elohim divided the light from the darkness.
  - Elohim called the light day, and the darkness He called night. It became evening and it became morning,
    one day.
  he:
  - בְּרֵאשִׁית בָּרָא אֱלֹהִים אֵת הַשָּׁמַיִם וְאֵת הָאָרֶץ׃
  - וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ וְחֹשֶׁךְ עַל־פְּנֵי תְהוֹם וְרוּחַ אֱלֹהִים מְרַחֶפֶת עַל־פְּנֵי
    הַמָּיִם׃
  - וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר וַיְהִי־אוֹר׃
  - וַיַּרְא אֱלֹהִים אֶת־הָאוֹר כִּי־טוֹב וַיַּבְדֵּל אֱלֹהִים בֵּין הָאוֹר וּבֵין הַחֹשֶׁךְ׃
  - וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם וְלַחֹשֶׁךְ קָרָא לָיְלָה וַיְהִי־עֶרֶב וַיְהִי־בֹקֶר יוֹם אֶחָד׃
- ref: Genesis 1:6-8
  he_ref: בראשית א׳:ו׳-ח׳
  en:
  - Elohim said, Let there be a canopy in the midst of the waters, and let it divide between waters and
    waters.
  - Elohim made the canopy, and divided the waters which were beneath the canopy, from the waters which
    were above the canopy, and it was so.
  - Elohim called the canopy heaven. It became evening and it became morning the second day.
  he:
  - וַיֹּאמֶר אֱלֹהִים יְהִי רָקִיעַ בְּתוֹךְ הַמָּיִם וִיהִי מַבְדִּיל בֵּין מַיִם לָמָיִם׃
  - וַיַּעַשׂ אֱלֹהִים אֶת־הָרָקִיעַ וַיַּבְדֵּל בֵּין הַמַּיִם אֲשֶׁר מִתַּחַת לָרָקִיעַ וּבֵין הַמַּיִם
    אֲשֶׁר מֵעַל לָרָקִיעַ וַיְהִי־כֵן׃
  - וַיִּקְרָא אֱלֹהִים לָרָקִיעַ שָׁמָיִם וַיְהִי־עֶרֶב וַיְהִי־בֹקֶר יוֹם שֵׁנִי׃
- ref: Genesis 1:9-13
  he_ref: בראשית א׳:ט׳-י״ג
  en:
  - Elohim said, Let the waters beneath the heavens be gathered into one place, and let the dryness be
    seen. It was so.
  - Elohim called the dryness, earth, and the gathering of the waters, He called seas, and Elohim saw
    that it was good.
  - Elohim said, Let the earth sprout grass, seed-yielding herbs, fruit trees bearing fruit of its own
    kind, with its seed within it, upon the earth. And it was so.
  - The earth brought forth grass, herbs yielding seed of its kind, and trees bearing fruit which has
    in it seeds of its kind; and Elohim saw that it was good.
  - It became evening and it became morning, the third day.
  he:
  - וַיֹּאמֶר אֱלֹהִים יִקָּווּ הַמַּיִם מִתַּחַת הַשָּׁמַיִם אֶל־מָקוֹם אֶחָד וְתֵרָאֶה הַיַּבָּשָׁה
    וַיְהִי־כֵן׃
  - וַיִּקְרָא אֱלֹהִים לַיַּבָּשָׁה אֶרֶץ וּלְמִקְוֵה הַמַּיִם קָרָא יַמִּים וַיַּרְא אֱלֹהִים כִּי־טוֹב׃
  - וַיֹּאמֶר אֱלֹהִים תַּדְשֵׁא הָאָרֶץ דֶּשֶׁא עֵשֶׂב מַזְרִיעַ זֶרַע עֵץ פְּרִי עֹשֶׂה פְּרִי לְמִינוֹ
    אֲשֶׁר זַרְעוֹ־בוֹ עַל־הָאָרֶץ וַיְהִי־כֵן׃
  - וַתּוֹצֵא הָאָרֶץ דֶּשֶׁא עֵשֶׂב מַזְרִיעַ זֶרַע לְמִינֵהוּ וְעֵץ עֹשֶׂה־פְּרִי אֲשֶׁר זַרְעוֹ־בוֹ
    לְמִינֵהוּ וַיַּרְא אֱלֹהִים כִּי־טוֹב׃
  - וַיְהִי־עֶרֶב וַיְהִי־בֹקֶר יוֹם שְׁלִישִׁי׃
- ref: Genesis 1:14-19
  he_ref: בראשית א׳:י״ד-י״ט
  en:
  - Elohim said, Let there be lights in the canopy of heaven to divide between the day and the night,
    and they will serve for signs for seasons, (for) days and (for) years.
  - They will be for lights in the canopy of heaven to illuminate the earth. And it was so.
  - Elohim made the two great lights, the large light to rule the day, and the small light to rule the
    night, and the stars
  - Elohim set them in the canopy of the heaven to illuminate the earth,
  - to rule in the day and the night, and to divide between the light and the darkness; and Elohim saw
    that it was good.
  - It became evening and it became morning, the fourth day.
  he:
  - וַיֹּאמֶר אֱלֹהִים יְהִי מְאֹרֹת בִּרְקִיעַ הַשָּׁמַיִם לְהַבְדִּיל בֵּין הַיּוֹם וּבֵין הַלָּיְלָה
    וְהָיוּ לְאֹתֹת וּלְמוֹעֲדִים וּלְיָמִים וְשָׁנִים׃
  - וְהָיוּ לִמְאוֹרֹת בִּרְקִיעַ הַשָּׁמַיִם לְהָאִיר עַל־הָאָרֶץ וַיְהִי־כֵן׃
  - וַיַּעַשׂ אֱלֹהִים אֶת־שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים אֶת־הַמָּאוֹר הַגָּדֹל לְמֶמְשֶׁלֶת הַיּוֹם וְאֶת־הַמָּאוֹר
    הַקָּטֹן לְמֶמְשֶׁלֶת הַלַּיְלָה וְאֵת הַכּוֹכָבִים׃
  - וַיִּתֵּן אֹתָם אֱלֹהִים בִּרְקִיעַ הַשָּׁמָיִם לְהָאִיר עַל־הָאָרֶץ׃
  - וְלִמְשֹׁל בַּיּוֹם וּבַלַּיְלָה וּלֲהַבְדִּיל בֵּין הָאוֹר וּבֵין הַחֹשֶׁךְ וַיַּרְא אֱלֹהִים כִּי־טוֹב׃
  - וַיְהִי־עֶרֶב וַיְהִי־בֹקֶר יוֹם רְבִיעִי׃
- ref: Genesis 1:20-23
  he_ref: בראשית א׳:כ׳-כ״ג
  en:
  - Elohim said, Let the waters teem with swarms of living creatures, and let birds fly above the earth,
    in the open canopy of the heaven.
  - And thus Elohim created the great whales, and every living creature that creeps, with which the waters
    teem, of its kind, and every winged bird of its kind; and Elohim saw that it was good.
  - Elohim blessed them saying, Be fruitful and multiply, fill the waters of the seas, and let the birds
    multiply on the earth.
  - It became evening and it became morning, the fifth day.
  he:
  - וַיֹּאמֶר אֱלֹהִים יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ נֶפֶשׁ חַיָּה וְעוֹף יְעוֹפֵף עַל־הָאָרֶץ עַל־פְּנֵי
    רְקִיעַ הַשָּׁמָיִם׃
  - וַיִּבְרָא אֱלֹהִים אֶת־הַתַּנִּינִם הַגְּדֹלִים וְאֵת כָּל־נֶפֶשׁ הַחַיָּה הָרֹמֶשֶׂת אֲשֶׁר שָׁרְצוּ
    הַמַּיִם לְמִינֵהֶם וְאֵת כָּל־עוֹף כָּנָף לְמִינֵהוּ וַיַּרְא אֱלֹהִים כִּי־טוֹב׃
  - וַיְבָרֶךְ אֹתָם אֱלֹהִים לֵאמֹר פְּרוּ וּרְבוּ וּמִלְאוּ אֶת־הַמַּיִם בַּיַּמִּים וְהָעוֹף יִרֶב
    בָּאָרֶץ׃
  - וַיְהִי־עֶרֶב וַיְהִי־בֹקֶר יוֹם חֲמִישִׁי׃
- ref: Genesis 1:24-31
  he_ref: בראשית א׳:כ״ד-ל״א
  en:
  - Elohim said, Let the earth bring forth living creatures, each of its kind, animals [of pasture], creeping
    things, and beasts of the earth, each to its kind. And it was so.
  - And thus Elohim made the beasts of the earth, each of its kind, the animals [of pasture] each of its
    kind, and everything that creeps on the ground, each of its kind, and Elohim saw that it was good.
  - Elohim said, Let us make man in our image, as our likeness, and let him dominate the fish of the sea,
    the birds of the heaven, the animals, all the earth, and every creeping thing that creeps on the earth.
  - And thus Elohim created man in his image. In the form of Elohim, He created him, male and female,
    He created them.
  - Elohim blessed them, and Elohim said to them, Be fruitful and multiply, fill the earth and subdue
    it, and dominate the fish of the sea, the birds of the heaven, and every living thing that moves upon
    the earth.
  - Elohim said, Behold, I have given you all seed-yielding herbs that are on the surface of the earth,
    and every tree that has seed-yielding fruit; to you it shall be for food.
  - And for every animal of the earth, for every bird of the heaven, and for everything that creeps on
    the ground, in which there is a living spirit, all vegetational herbs shall be [their] food. And it
    was so.
  - Elohim saw all that He had made, and behold it was very good. It became evening and it became morning,
    the sixth day.
  he:
  - וַיֹּאמֶר אֱלֹהִים תּוֹצֵא הָאָרֶץ נֶפֶשׁ חַיָּה לְמִינָהּ בְּהֵמָה וָרֶמֶשׂ וְחַיְתוֹ־אֶרֶץ לְמִינָהּ
    וַיְהִי־כֵן׃
  - וַיַּעַשׂ אֱלֹהִים אֶת־חַיַּת הָאָרֶץ לְמִינָהּ וְאֶת־הַבְּהֵמָה לְמִינָהּ וְאֵת כָּל־רֶמֶשׂ הָאֲדָמָה
    לְמִינֵהוּ וַיַּרְא אֱלֹהִים כִּי־טוֹב׃
  - וַיֹּאמֶר אֱלֹהִים נַעֲשֶׂה אָדָם בְּצַלְמֵנוּ כִּדְמוּתֵנוּ וְיִרְדּוּ בִדְגַת הַיָּם וּבְעוֹף הַשָּׁמַיִם
    וּבַבְּהֵמָה וּבְכָל־הָאָרֶץ וּבְכָל־הָרֶמֶשׂ הָרֹמֵשׂ עַל־הָאָרֶץ׃
  - וַיִּבְרָא אֱלֹהִים אֶת־הָאָדָם בְּצַלְמוֹ בְּצֶלֶם אֱלֹהִים בָּרָא אֹתוֹ זָכָר וּנְקֵבָה בָּרָא אֹתָם׃
  - וַיְבָרֶךְ אֹתָם אֱלֹהִים וַיֹּאמֶר לָהֶם אֱלֹהִים פְּרוּ וּרְבוּ וּמִלְאוּ אֶת־הָאָרֶץ וְכִבְשֻׁהָ
    וּרְדוּ בִּדְגַת הַיָּם וּבְעוֹף הַשָּׁמַיִם וּבְכָל־חַיָּה הָרֹמֶשֶׂת עַל־הָאָרֶץ׃
  - וַיֹּאמֶר אֱלֹהִים הִנֵּה נָתַתִּי לָכֶם אֶת־כָּל־עֵשֶׂב זֹרֵעַ זֶרַע אֲשֶׁר עַל־פְּנֵי כָל־הָאָרֶץ
    וְאֶת־כָּל־הָעֵץ אֲשֶׁר־בּוֹ פְרִי־עֵץ זֹרֵעַ זָרַע לָכֶם יִהְיֶה לְאָכְלָה׃
  - וּלְכָל־חַיַּת הָאָרֶץ וּלְכָל־עוֹף הַשָּׁמַיִם וּלְכֹל רוֹמֵשׂ עַל־הָאָרֶץ אֲשֶׁר־בּוֹ נֶפֶשׁ חַיָּה
    אֶת־כָּל־יֶרֶק עֵשֶׂב לְאָכְלָה וַיְהִי־כֵן׃
  - וַיַּרְא אֱלֹהִים אֶת־כָּל־אֲשֶׁר עָשָׂה וְהִנֵּה־טוֹב מְאֹד וַיְהִי־עֶרֶב וַיְהִי־בֹקֶר יוֹם הַשִּׁשִּׁי׃
- ref: Genesis 2:1-3
  he_ref: בראשית ב׳:א׳-ג׳
  en:
  - The heavens and the earth were completed, and [so were] all their conglomerations.
  - Elohim completed by the seventh day His work which He had made, and He abstained on the seventh day
    from all His work which He had made.
  - Elohim blessed the seventh day and sanctified it, for on it He abstained from all His work, which
    Elohim had created to do.
  he:
  - וַיְכֻלּוּ הַשָּׁמַיִם וְהָאָרֶץ וְכָל־צְבָאָם׃
  - וַיְכַל אֱלֹהִים בַּיּוֹם הַשְּׁבִיעִי מְלַאכְתּוֹ אֲשֶׁר עָשָׂה וַיִּשְׁבֹּת בַּיּוֹם הַשְּׁבִיעִי
    מִכָּל־מְלַאכְתּוֹ אֲשֶׁר עָשָׂה׃
  - וַיְבָרֶךְ אֱלֹהִים אֶת־יוֹם הַשְּׁבִיעִי וַיְקַדֵּשׁ אֹתוֹ כִּי בוֹ שָׁבַת מִכָּל־מְלַאכְתּוֹ אֲשֶׁר־בָּרָא
    אֱלֹהִים לַעֲשׂוֹת׃
- ref: Genesis 2:7
  he_ref: בראשית ב׳:ז׳
  en:
  - Adonoy Elohim then formed the man, dust from the ground, and He blew into his nostrils the breath
    of life. And so man became a living soul.
  he:
  - וַיִּיצֶר יְהוָה אֱלֹהִים אֶת־הָאָדָם עָפָר מִן־הָאֲדָמָה וַיִּפַּח בְּאַפָּיו נִשְׁמַת חַיִּים וַיְהִי
    הָאָדָם לְנֶפֶשׁ חַיָּה׃
- ref: Genesis 2:15
  he_ref: בראשית ב׳:ט״ו
  en:
  - Adonoy Elohim took the man, and put him in the Garden of Eden, to work it and to preserve it.
  he:
  - וַיִּקַּח יְהוָה אֱלֹהִים אֶת־הָאָדָם וַיַּנִּחֵהוּ בְגַן־עֵדֶן לְעָבְדָהּ וּלְשָׁמְרָהּ׃
- ref: Genesis 2:18-20
  he_ref: בראשית ב׳:י״ח-כ׳
  en:
  - Adonoy Elohim said, It is not good for the man to be alone. I will make a helper for him.
  - Adonoy Elohim formed from the ground, every beast of the field, and every bird of the heaven, and
    brought them to the man, to see what he would call them. Whatever the man called [each] living creature,
    that is its name.
  - The man gave names to every animal, to the birds of the heaven, and to every beast of the field, but
    the man did not find a helper for himself.
  he:
  - וַיֹּאמֶר יְהוָה אֱלֹהִים לֹא־טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ אֶעֱשֶׂהּ־לּוֹ עֵזֶר כְּנֶגְדּוֹ׃
  - וַיִּצֶר יְהוָה אֱלֹהִים מִן־הָאֲדָמָה כָּל־חַיַּת הַשָּׂדֶה וְאֵת כָּל־עוֹף הַשָּׁמַיִם וַיָּבֵא
    אֶל־הָאָדָם לִרְאוֹת מַה־יִּקְרָא־לוֹ וְכֹל אֲשֶׁר יִקְרָא־לוֹ הָאָדָם נֶפֶשׁ חַיָּה הוּא שְׁמוֹ׃
  - וַיִּקְרָא הָאָדָם שֵׁמוֹת לְכָל־הַבְּהֵמָה וּלְעוֹף הַשָּׁמַיִם וּלְכֹל חַיַּת הַשָּׂדֶה וּלְאָדָם
    לֹא־מָצָא עֵזֶר כְּנֶגְדּוֹ׃
- ref: Genesis 2:21-23
  he_ref: בראשית ב׳:כ״א-כ״ג
  en:
  - Adonoy Elohim caused unconsciousness to fall upon the man and he slept. He took one of his ribs and
    closed over flesh in its place.
  - Adonoy Elohim built the rib that He took from the man into a woman, and He brought her to the man.
  - 'The man said: This at last is bone of my bones and flesh of my flesh. This shall be called Woman,
    for from Man was she taken.'
  he:
  - וַיַּפֵּל יְהוָה אֱלֹהִים תַּרְדֵּמָה עַל־הָאָדָם וַיִּישָׁן וַיִּקַּח אַחַת מִצַּלְעֹתָיו וַיִּסְגֹּר
    בָּשָׂר תַּחְתֶּנָּה׃
  - וַיִּבֶן יְהוָה אֱלֹהִים אֶת־הַצֵּלָע אֲשֶׁר־לָקַח מִן־הָאָדָם לְאִשָּׁה וַיְבִאֶהָ אֶל־הָאָדָם׃
  - וַיֹּאמֶר הָאָדָם זֹאת הַפַּעַם עֶצֶם מֵעֲצָמַי וּבָשָׂר מִבְּשָׂרִי לְזֹאת יִקָּרֵא אִשָּׁה כִּי
    מֵאִישׁ לֻקֳחָה־זֹּאת׃
- ref: Genesis 3:1-7
  he_ref: בראשית ג׳:א׳-ז׳
  en:
  - The serpent was more cunning than any beast of the field which Adonoy Elohim made; and it said to
    the woman, Did Elohim even say that you should not eat from all the trees of the Garden?
  - The woman said to the serpent, From the fruit of the trees of the Garden we may eat.
  - But of the fruit of the tree that is in the middle of the Garden, Elohim said, You shall not eat from
    it, neither shall you touch it, lest you die.
  - The serpent said to the woman, You certainly will not die.
  - For Elohim (knows) that on the day you will eat from it, your eyes will be opened, and you will become
    as gods, knowing what is good and what is evil.
  - The woman saw that the tree was good for food, and that it was tempting to the eyes, and that the
    tree was appealing as a means of [obtaining] wisdom. She took of its fruit and she ate, and she also
    gave it to her husband with her, and he ate.
  - The eyes of both of them were opened, and they realized that they were naked. They sewed together
    fig leaves, and made for themselves loincloths.
  he:
  - וְהַנָּחָשׁ הָיָה עָרוּם מִכֹּל חַיַּת הַשָּׂדֶה אֲשֶׁר עָשָׂה יְהוָה אֱלֹהִים וַיֹּאמֶר אֶל־הָאִשָּׁה
    אַף כִּי־אָמַר אֱלֹהִים לֹא תֹאכְלוּ מִכֹּל עֵץ הַגָּן׃
  - וַתֹּאמֶר הָאִשָּׁה אֶל־הַנָּחָשׁ מִפְּרִי עֵץ־הַגָּן נֹאכֵל׃
  - וּמִפְּרִי הָעֵץ אֲשֶׁר בְּתוֹךְ־הַגָּן אָמַר אֱלֹהִים לֹא תֹאכְלוּ מִמֶּנּוּ וְלֹא תִגְּעוּ בּוֹ
    פֶּן־תְּמֻתוּן׃
  - וַיֹּאמֶר הַנָּחָשׁ אֶל־הָאִשָּׁה לֹא־מוֹת תְּמֻתוּן׃
  - כִּי יֹדֵעַ אֱלֹהִים כִּי בְּיוֹם אֲכָלְכֶם מִמֶּנּוּ וְנִפְקְחוּ עֵינֵיכֶם וִהְיִיתֶם כֵּאלֹהִים
    יֹדְעֵי טוֹב וָרָע׃
  - וַתֵּרֶא הָאִשָּׁה כִּי טוֹב הָעֵץ לְמַאֲכָל וְכִי תַאֲוָה־הוּא לָעֵינַיִם וְנֶחְמָד הָעֵץ לְהַשְׂכִּיל
    וַתִּקַּח מִפִּרְיוֹ וַתֹּאכַל וַתִּתֵּן גַּם־לְאִישָׁהּ עִמָּהּ וַיֹּאכַל׃
  - וַתִּפָּקַחְנָה עֵינֵי שְׁנֵיהֶם וַיֵּדְעוּ כִּי עֵירֻמִּם הֵם וַיִּתְפְּרוּ עֲלֵה תְאֵנָה וַיַּעֲשׂוּ
    לָהֶם חֲגֹרֹת׃
- ref: Genesis 3:20-21
  he_ref: בראשית ג׳:כ׳-כ״א
  en:
  - The man called his wife’s name Chavah, [Eve] because she had become the mother of all living.
  - And Adonoy Elohim made for Adam and his wife leather coats and He clothed them.
  he:
  - וַיִּקְרָא הָאָדָם שֵׁם אִשְׁתּוֹ חַוָּה כִּי הִוא הָיְתָה אֵם כָּל־חָי׃
  - וַיַּעַשׂ יְהוָה אֱלֹהִים לְאָדָם וּלְאִשְׁתּוֹ כָּתְנוֹת עוֹר וַיַּלְבִּשֵׁם׃
commentaries:
- ref: Rashi on Genesis 1:1:1
  note: 'Why the Torah begins with creation: the whole world belongs to Hashem.'
  en: 'בראשית IN THE BEGINNING — Rabbi Isaac said: The Torah which is the Law book of Israel should have
    commenced with the verse (Exodus 12:2) “This month shall be unto you the first of the months” which
    is the first commandment given to Israel. What is the reason, then, that it commences with the account
    of the Creation? Because of the thought expressed in the text (Psalms 111:6) “He declared to His people
    the strength of His works (i.e. He gave an account of the work of Creation), in order that He might
    give them the heritage of the nations.” For should the peoples of the world say to Israel, “You are
    robbers, because you took by force the lands of the seven nations of Canaan”, Israel may reply to
    them, “All the earth belongs to the Holy One, blessed be He; He created it and gave it to whom He
    pleased. When He willed He gave it to them, and when He willed He took it from them and gave it to
    us” (Yalkut Shimoni on Torah 187).'
  en_version:
    title: Pentateuch with Rashi's commentary by M. Rosenbaum and A.M. Silbermann, 1929-1934
    license: Public Domain
  he: 'בראשית. אָמַר רַבִּי יִצְחָק לֹֹֹֹֹא הָיָה צָרִיךְ לְהַתְחִיל אֶת הַתּוֹרָה אֶלָּא מֵהַחֹדֶשׁ הַזֶּה
    לָכֶם, שֶׁהִיא מִצְוָה רִאשׁוֹנָה שֶׁנִּצְטַוּוּ בָּהּ יִשׂרָאֵל, וּמַה טַּעַם פָּתַח בִּבְרֵאשִׁית?
    מִשׁוּם כֹּחַ מַעֲשָׂיו הִגִּיד לְעַמּוֹ לָתֵת לָהֶם נַחֲלַת גּוֹיִם (תהילים קי"א), שֶׁאִם יֹאמְרוּ
    אֻמּוֹת הָעוֹלָם לְיִשְׁרָאֵל לִסְטִים אַתֶּם, שֶׁכְּבַשְׁתֶּם אַרְצוֹת שִׁבְעָה גוֹיִם, הֵם אוֹמְרִים
    לָהֶם כָּל הָאָרֶץ שֶׁל הַקָּבָּ"ה הִיא, הוּא בְרָאָהּ וּנְתָנָהּ לַאֲשֶׁר יָשַׁר בְּעֵינָיו, בִּרְצוֹנוֹ
    נְתָנָהּ לָהֶם, וּבִרְצוֹנוֹ נְטָלָהּ מֵהֶם וּנְתָנָהּ לָנוּ:'
  he_version:
    title: Pentateuch with Rashi's commentary by M. Rosenbaum and A.M. Silbermann, 1929-1934
    license: Public Domain
- ref: Kohelet Rabbah 7:13:1
  note: 'Hashem shows Adam the trees: ''do not ruin My world'' (caring for the world).'
  en: '“See the work of God, for who can mend what He has warped?” (Ecclesiastes 7:13) “See the work of
    God, for who can mend what He has warped?” When the Holy One blessed be He created Adam the first
    man, He took him and showed him all the trees in the Garden of Eden, and He said to him: ‘See My creations,
    how beautiful and exemplary they are. Everything I created, I created for you. Make certain that you
    do not ruin and destroy My world, as if you destroy it, there will be no one to mend it after you.
    Moreover, you will cause death to that righteous one.’ To what is the matter of [the death of] Moses
    our master analogous? [It is analogous] to a pregnant woman who was incarcerated in prison. She gave
    birth to a son, raised him, and she died there. Sometime later the king passed the entrance of the
    prison. As the king was passing, that son began screaming and he said: ‘My lord the king, I was born
    here, I grew up here; I do not know due to what sin am I placed here.’ [The king] said to him: ‘Due
    to your mother’s sin.’ So too regarding Moses, as it is written: “Behold, the man has become like
    one [of us]” (Genesis 3:22). And it is written: “Behold, your days are drawing near to die” (Deuteronomy
    31:14).'
  en_version:
    title: The Sefaria Midrash Rabbah, 2022
    license: CC-BY
  he: 'רְאֵה אֶת מַעֲשֵׂה הָאֱלֹהִים כִּי מִי יוּכַל לְתַקֵּן אֵת אֲשֶׁר עִוְּתוֹ, בְּשָׁעָה שֶׁבָּרָא
    הַקָּדוֹשׁ בָּרוּךְ הוּא אֶת אָדָם הָרִאשׁוֹן, נְטָלוֹ וְהֶחֱזִירוֹ עַל כָּל אִילָנֵי גַּן עֵדֶן,
    וְאָמַר לוֹ, רְאֵה מַעֲשַׂי כַּמָּה נָאִים וּמְשֻׁבָּחִין הֵן, וְכָל מַה שֶּׁבָּרָאתִי בִּשְׁבִילְךָ
    בָּרָאתִי, תֵּן דַּעְתְּךָ שֶׁלֹא תְקַלְקֵל וְתַחֲרִיב אֶת עוֹלָמִי, שֶׁאִם קִלְקַלְתָּ אֵין מִי שֶׁיְתַקֵּן
    אַחֲרֶיךָ, וְלֹא עוֹד שֶׁאַתְּ גּוֹרֵם מִיתָה לְאוֹתוֹ צַדִּיק. מָשָׁל משֶׁה רַבֵּנוּ לְמָה הַדָּבָר
    דּוֹמֶה, לְאִשָּׁה עֻבָּרָה שֶׁהָיְתָה חֲבוּשָׁה בְּבֵית הָאֲסוּרִים, יָלְדָה שָׁם בֵּן, גִּדְלָה
    שָׁם וּמֵתָה שָׁם, לְיָמִים עָבַר הַמֶּלֶךְ עַל פֶּתַח הָאֲסוּרִים, כְּשֶׁהַמֶּלֶךְ עוֹבֵר הִתְחִיל
    אוֹתוֹ הַבֵּן צוֹוֵחַ וְאוֹמֵר אֲדֹנִי הַמֶּלֶךְ כָּאן נוֹלַדְתִּי, כָּאן גָּדַלְתִּי, בְּאֵיזֶה חֵטְא
    אֲנִי נָתוּן כָּאן אֵינִי יוֹדֵעַ. אָמַר לוֹ, בַּחֵטְא שֶׁל אִמְּךָ. כָּךְ בְּמשֶׁה, כְּמוֹ שֶׁכָּתוּב
    (בראשית ג, כב): הֵן הָאָדָם הָיָה כְּאַחַד, כְּתִיב (דברים לא, יד): הֵן קָרְבוּ יָמֶיךָ לָמוּת.'
  he_version:
    title: Midrash Rabbah -- TE
    license: Public Domain
- ref: Sanhedrin 37a
  note: 'One person was created alone, so each person is like a whole world (also Mishnah Sanhedrin 4:5).
    Ref only: the daf is long and mostly about courts.'
