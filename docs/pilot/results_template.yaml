  q2_minutes_long: []          # card ids that ran long
  q3_readability: 0            # 1 (hard) .. 5 (easy)
  q4_best: {card: "", why: ""}
  q5_flat: {card: "", fix: ""}
  q6_hebrew_load: right        # too many | right | too few
  q7_hard_question: {asked: false, which: "", script_worked: null}
  q8_extras: {used: [], again: []}

