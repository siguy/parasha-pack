story_world_notes: >-
  Shushan (Susa) was an Achaemenid Persian capital (about 480 BCE). Its palace (apadana) had tall slender
  fluted stone columns topped with twin-bull capitals, flat roofs and cedar-beam ceilings, wide staircases
  with reliefs, and walls of glazed bricks in turquoise, gold and cream (rows of rosettes, striding lions).
  Doorways were rectangular. Pointed or horseshoe arches, domes and zellige tiles are Islamic-era and wrong.
  No Star of David (a much later symbol). Royalty wore long robes, crenellated or tall cylindrical crowns.
  The Megillah is one scroll rolled on itself (no twin wooden rollers like a Torah scroll).
