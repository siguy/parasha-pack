# Agent 02: Curriculum Designer — Bereshit. A SEQUENCE deck (00-series.yaml: deck_pattern: sequence,
# story_cards: 7): the creation story is a numbered list in the Torah itself, so each day gets its own
# story card (story_N = Day N, Simon 2026-10-06). 13 cards. "Adam names the animals" now lives on
# Adam's spotlight. Spotlight/anchor minutes and core as in the approved mockup docs/mockups/bereshit-v3.html.
agent: 02-curriculum-designer
deck_id: bereshit
holiday: false
focal_incident: "Hashem puts Adam in the garden to work it and guard it (Genesis 2:15): the world is good, and we take care of it."
story_world: >-
  Gan Eden and the newly created world: lush soft green hills, a clear sparkling river, fruit trees heavy
  with fruit, bright flowers, gentle friendly animals, wide open sky and warm luminous golden light.
  Pre-civilization: no buildings, no houses, no fences, no tools, no modern objects. Adam and Chava wear
  simple, modest, full-coverage tunics. Hashem is never shown as a figure, only as light.
story_world_setting: outdoor
learning_objectives:
  understand: "Hashem made the whole world in six days and it was all good (tov); on day seven Hashem rested: Shabbat."
  feel: "Wonder at how good and beautiful the world is, and pride in helping to care for it."
  do: "Name one way to take care of Hashem's world (water a plant, be gentle with animals, keep our room tidy) and say TOV with a thumbs up."
week_plan:
  - {day: 1, label: "This card + Days 1–2", cards: [anchor_1, story_1, story_2]}
  - {day: 2, label: "Days 3–4", cards: [story_3, story_4]}
  - {day: 3, label: "Days 5–6 + Adam", cards: [story_5, story_6, spotlight_1]}
  - {day: 4, label: "Chava + Connection", cards: [spotlight_2, connection_1]}
  - {day: 5, label: "Day 7 Shabbat + Tov + Home", cards: [story_7, power_word_1, home_1]}
cards:
  - {card_id: anchor_1, card_type: anchor, title_en: "In the Beginning", purpose: "calm hook: Hashem made the whole world, one day at a time; the week's big idea (a beautiful world for us) and the 7-day overview",
     core: true, minutes: 5, refs: ["Genesis 1:1", "Genesis 1:31", "Genesis 2:1"], text_ref: "Genesis 1:1-2:3"}
  - {card_id: story_1, card_type: story, sequence_number: 1, title_en: "Day 1: Light", purpose: "light in the dark; day and night. Gesture: open hands. TOV",
     core: true, minutes: 3, characters: [], refs: ["Genesis 1:3-5"], text_ref: "Genesis 1:3-5"}
  - {card_id: story_2, card_type: story, sequence_number: 2, title_en: "Day 2: Sky & Water", purpose: "the sky between the waters above and below. Gesture: reach up. No TOV (the Torah doesn't say it on Day 2)",
     core: true, minutes: 3, characters: [], refs: ["Genesis 1:6-8"], text_ref: "Genesis 1:6-8"}
  - {card_id: story_3, card_type: story, sequence_number: 3, title_en: "Day 3: Land & Trees", purpose: "dry land, seas, grass and trees. Gesture: grow like a tree. TOV",
     core: true, minutes: 3, characters: [], refs: ["Genesis 1:9-13"], text_ref: "Genesis 1:9-13"}
  - {card_id: story_4, card_type: story, sequence_number: 4, title_en: "Day 4: Sun & Moon", purpose: "sun for the day, moon and stars for the night. Gesture: twinkle fingers. TOV",
     core: true, minutes: 3, characters: [], refs: ["Genesis 1:14-19"], text_ref: "Genesis 1:14-19"}
  - {card_id: story_5, card_type: story, sequence_number: 5, title_en: "Day 5: Fish & Birds", purpose: "fish in the water, birds in the sky. Gesture: swim hands. TOV",
     core: true, minutes: 3, characters: [], refs: ["Genesis 1:20-23"], text_ref: "Genesis 1:20-23"}
  - {card_id: story_6, card_type: story, sequence_number: 6, title_en: "Day 6: Animals & People", purpose: "land animals, then Adam and Chava. Gesture: wave hello (+ a soft roar). Very TOV",
     core: true, minutes: 3, characters: [adam, chava], refs: ["Genesis 1:24-31"], text_ref: "Genesis 1:24-31"}
  - {card_id: story_7, card_type: story, sequence_number: 7, title_en: "Day 7: Shabbat", purpose: "Hashem rests and makes Shabbat special; the full 7-gesture chant; taught on Friday",
     core: true, minutes: 3, characters: [], refs: ["Genesis 2:1-3"], text_ref: "Genesis 2:1-3"}
  - {card_id: spotlight_1, card_type: spotlight, title_en: "Adam", purpose: "meet Adam, made from the earth (adam/adamah); his jobs: take care of the garden AND name the animals (the focal incident)",
     core: true, minutes: 4, characters: [adam], refs: ["Genesis 2:7", "Genesis 2:15", "Genesis 2:19-20"], text_ref: "Genesis 2:7, 2:15, 2:19-20"}
  - {card_id: spotlight_2, card_type: spotlight, title_en: "Chava", purpose: "not good to be alone: meet Chava; Adam and Chava help each other",
     core: false, minutes: 3, characters: [chava], refs: ["Genesis 2:18", "Genesis 2:21-23", "Genesis 3:20"], text_ref: "Genesis 2:18, 2:21-23"}
  - {card_id: connection_1, card_type: connection, title_en: "Taking Care of Our World", purpose: "modern world: each child names one way they care for Hashem's world",
     core: false, minutes: 5, characters: [], refs: [], text_ref: "Genesis 2:15"}
  - {card_id: power_word_1, card_type: power_word, title_en: "Tov · Good!", purpose: "power word טוֹב with the thumbs-up gesture; count 7 TOVs",
     core: true, minutes: 3, characters: [adam, chava], refs: ["Genesis 1:31"], text_ref: "Genesis 1:31"}
  - {card_id: home_1, card_type: home, title_en: "This Week: Bereshit", purpose: "family link: Shabbat-table question, tov walk",
     core: false, minutes: 0, characters: [], refs: [], text_ref: "Genesis 1:1-2:3"}
