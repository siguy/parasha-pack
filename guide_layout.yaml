# Teacher guide booklet: the fixed page map (decision D5).
#
# The guide is printed on 8.5x11 letter paper. Every deck of the same kind
# uses the SAME page numbers, so a teacher always finds "Story 2" on p.7.
# Card backs show "Guide p.N"; that N comes from this file.
#
# Who reads this file:
#   - src/validate_deck.py checks that each card's back.guide_ref.page
#     matches the page for its card slot here (error on mismatch).
#   - build_guide.py (Phase 8) will lay the booklet out from it.
#
# A "slot" is the card_id (anchor_1, story_3, ...). Fixed pages hold
# booklet-only content that is not tied to one card.
#
# Standard deck = 10 cards. Holiday deck = 12 cards (one story card is
# replaced by three tradition cards, decision D1).

standard:
  cards:
    anchor_1: 2        # week plan + the anchor card
    spotlight_1: 4
    spotlight_2: 5
    story_1: 6
    story_2: 7
    story_3: 8
    story_4: 9
    connection_1: 10
    power_word_1: 11
    home_1: 15         # the home card goes out with the family letter
  fixed:
    cover: 1
    overview: 3        # the parasha in brief + the value (middah)
    hard_questions: 12 # scripted answers (hard-text policy, rule 6)
    adaptations: 13    # see / do / join for every card
    extras_index: 14   # coloring, bingo, I-spy, match-it...
    family_letter: 15  # photocopiable
    sources: 16        # verse refs and commentaries

holiday:
  cards:
    anchor_1: 2
    spotlight_1: 4
    spotlight_2: 5
    story_1: 6
    story_2: 7
    story_3: 8
    tradition_1: 9
    tradition_2: 10
    tradition_3: 11
    connection_1: 12
    power_word_1: 13
    home_1: 17
  fixed:
    cover: 1
    overview: 3
    hard_questions: 14
    adaptations: 15
    extras_index: 16
    family_letter: 17
    sources: 18
