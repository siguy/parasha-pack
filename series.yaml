# Parasha Pack year plan: every deck in the series, in one place.
#
# The Series Planner (agent 00) reads and updates this file. src/series.py loads and
# validates it:  cd src && python3 series.py
#
# Layout:
#   fall_holidays  taught at the start of the school year, before Bereshit
#   parshiyot      all 54, in Torah order, grouped by book (comments)
#   holidays       the rest of the year; "before: <parasha id>" = taught in about the
#                  week before that parasha (approximate, the calendar moves each year)
#
# Each entry: id, name_en, name_he (nikud), type (parasha|holiday), book (parshiyot),
#   status (done|in_progress|planned), middah (from docs/policies/values-spine.md, or TBD),
#   power_word {he, translit, en} (or TBD), characters (keys in characters/),
#   sensitivities, notes.
#
# Rule (values-spine.md): no middah may repeat within 4 consecutive filled decks.

series: Parasha Pack
version: 1

fall_holidays:
  - id: rosh_hashanah
    name_en: Rosh Hashanah
    name_he: רֹאשׁ הַשָּׁנָה
    type: holiday
    status: planned
    middah: Kindness
    power_word: {he: שׁוֹפָר, translit: shofar, en: ram's horn}
    characters: []
    sensitivities:
      - "The shofar is loud: warn sound-sensitive children and let them cover their ears"
      - "Keep 'Hashem is our King' warm, not judging or scary"
    notes: "Tishrei 1 (Sep/Oct). Birthday of the world, apples and honey for a sweet year, starting the year doing kind things. Modern-world cards."
  - id: yom_kippur
    name_en: Yom Kippur
    name_he: יוֹם כִּפּוּר
    type: holiday
    status: planned
    middah: Forgiveness
    power_word: {he: סְלִיחָה, translit: slicha, en: sorry}
    characters: []
    sensitivities:
      - "Fasting is for grown-ups; children do not fast"
      - "Saying sorry without shame: no 'bad child' framing"
      - "Yonah story optional; the big fish is friendly, never scary"
    notes: "Tishrei 10. Saying sorry and making up; white clothes; quiet day in shul."
  - id: sukkot
    name_en: Sukkot
    name_he: סֻכּוֹת
    type: holiday
    status: planned
    middah: Gratitude
    power_word: {he: סֻכָּה, translit: sukkah, en: hut}
    characters: []
    sensitivities:
      - "Lulav and etrog shown with care (the etrog's tip is precious)"
      - "Ushpizin guests optional, teacher guide only"
    notes: "Tishrei 15-21. Building and decorating the sukkah, thanking Hashem for the harvest, inviting guests."
  - id: simchat_torah
    name_en: Simchat Torah
    name_he: שִׂמְחַת תּוֹרָה
    type: holiday
    status: planned
    middah: Joy
    power_word: {he: תּוֹרָה, translit: Torah, en: Torah}
    characters: []
    sensitivities:
      - "Simchat Torah 2023 (October 7) is painful for many families: keep the cards joyful, give teachers a gentle note in the guide only"
      - "Torah scrolls drawn with respect (covered, held, never on the floor)"
    notes: "Tishrei 22/23. Dancing with the Torah (hakafot), finishing V'Zot HaBerachah and starting Bereshit again."

parshiyot:
  # --- Genesis ---
  - id: bereshit
    name_en: Bereshit
    name_he: בְּרֵאשִׁית
    type: parasha
    book: Genesis
    status: done
    middah: Caring for the world
    power_word: {he: טוֹב, translit: TOV, en: good}
    characters: [adam, chava]
    sensitivities:
      - "The snake and the fruit (Genesis 3): teacher guide only, not on cards"
      - "Kayin and Hevel (Genesis 4): skipped"
      - "Adam and Chava always in simple modest full-coverage tunics (decision D3)"
      - "Hashem is never drawn as a person: light only"
    notes: "First v3 deck. Seven days of creation, Adam names the animals, caring for the garden (Genesis 2:15)."
  - id: noach
    name_en: Noach
    name_he: נֹחַ
    type: parasha
    book: Genesis
    status: planned
    middah: Patience
    power_word: {he: קֶשֶׁת, translit: keshet, en: rainbow}
    characters: [noach]
    sensitivities:
      - "The flood: no drowning people or animals, no destroyed homes; show the ark safe and cozy"
      - "Tower of Bavel: optional, teacher guide only"
      - "Noach's later life (Genesis 9:20-27): skipped"
    notes: "Building the ark, animals two by two, waiting in the ark, the dove, the rainbow promise. Noach needs a character.yaml + identity sheet."
  - id: lech_lecha
    name_en: Lech Lecha
    name_he: לֶךְ־לְךָ
    type: parasha
    book: Genesis
    status: planned
    middah: Trust in Hashem
    power_word: {he: כּוֹכָבִים, translit: kochavim, en: stars}
    characters: [avraham, sarah]
    sensitivities:
      - "Leaving home can be hard for children who have moved: name the feeling gently"
      - "War of the kings, Hagar and Yishmael, brit milah: teacher guide only or skipped"
    notes: "Avraham and Sarah travel to a new land; counting the stars. Avraham and Sarah designs are drafts (canonical: false): lock anchors and make identity sheets first."
  - {id: vayera, name_en: "Vayera", name_he: "וַיֵּרָא", type: parasha, book: Genesis, status: planned, middah: TBD, power_word: TBD, characters: [], sensitivities: [], notes: ""}
