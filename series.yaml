    sensitivities:
      - "Haman's plan: say he 'wanted to hurt the Jewish people'; no hanging, no battles"
      - "Haman is jealous and misguided, never scary"
    notes: "Adar 14 (Feb/Mar). The 13-card v2 deck in decks/purim/ is the style reference for the series."
